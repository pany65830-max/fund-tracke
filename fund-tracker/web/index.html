<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基金看板</title>
    <style>
      html,body{background:#08090d;color:#dce1ea;margin:0;}
      html[data-theme=light],html[data-theme=light] body{background:#f4f5f7;color:#1c212b;}
      html[data-theme=light] .cover-splash{background:#f4f5f7;}
      html[data-theme=light] .cover-mark{color:#9a7b45;}
      html[data-theme=light] .cover-progress{color:#667085;}
      .cover-splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08090d;transition:opacity 1.2s cubic-bezier(.4,0,.2,1);}
      .cover-splash.hiding{opacity:0;pointer-events:none;}
      .cover-mark{width:min(78vw,440px);color:#c9b07a;opacity:0;transform:translateY(14px);animation:cover-in 1.1s cubic-bezier(.22,1,.36,1) .12s forwards;}
      .cover-ht{display:block;width:100%;height:auto;}
      .cover-progress{margin:36px 0 0;font-size:11px;letter-spacing:.34em;color:#8b93a3;white-space:pre;opacity:0;transform:translateY(8px);animation:cover-in .9s ease .55s forwards;}
      .cover-splash.hiding .cover-mark{opacity:0;transform:scale(1.04);animation:none;transition:opacity .9s ease,transform 1.15s cubic-bezier(.22,1,.36,1);}
      .cover-splash.hiding .cover-progress{opacity:0;animation:none;transition:opacity .4s ease;}
      @keyframes cover-in{to{opacity:1;transform:none;}}
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ft-theme-pref");
          var theme = saved === "light" || saved === "dark" ? saved : "";
          if (!theme) {
            var hour = parseInt(new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Shanghai",
              hour: "2-digit",
              hour12: false
            }).format(new Date()), 10);
            theme = hour >= 6 && hour < 18 ? "light" : "dark";
          }
          if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot-cover" class="cover-splash" aria-hidden="true">
      <div class="cover-mark">
        <svg class="cover-ht" viewBox="0 0 360 176" shape-rendering="geometricPrecision">
          <g fill="currentColor">
            <polygon points="16,16 50,16 50,71 99.3,71 58.1,105 50,105 50,160 16,160" />
            <polygon points="120,16 154,16 154,160 120,160 120,105 70.7,105 111.9,71 120,71" />
            <polygon points="204,16 342,16 342,49 295.3,49 295.3,160 248.5,160 248.5,82 293,49 204,49" />
          </g>
        </svg>
      </div>
      <p class="cover-progress">LOADING&nbsp;&nbsp;0%</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
