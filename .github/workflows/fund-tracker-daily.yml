name: fund-tracker-daily
on:
  schedule:
    - cron: "30 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fund-tracker/package-lock.json
      - name: Install pipeline deps
        working-directory: fund-tracker
        run: npm ci
      - name: Ingest
        working-directory: fund-tracker
        env:
          IFIND_BASE_URL: ${{ secrets.IFIND_BASE_URL }}
          IFIND_TOKEN: ${{ secrets.IFIND_TOKEN }}
          IFIND_NEWS_PATH: ${{ secrets.IFIND_NEWS_PATH }}
          IFIND_ETF_PATH: ${{ secrets.IFIND_ETF_PATH }}
          IFIND_USE_FIXTURE: ${{ secrets.IFIND_USE_FIXTURE }}
        run: npm run ingest
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fund-tracker/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update fund-tracker snapshot"
            git push
          fi
      - name: Build web
        working-directory: fund-tracker
        run: |
          npm install --prefix web
          npm run build --prefix web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fund-tracker/web/dist

  deploy:
    needs: ingest-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
