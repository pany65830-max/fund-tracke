name: fund-tracker-daily

# 数据由本机定时任务（FundTrackerDailyIngest，每日 08:30 北京时间）拉取 iFinD
# 并 push 到 main；本工作流【只负责构建 + 部署】，不再在 GitHub Actions 里重新
# ingest（海外节点连不上 iFinD，且重跑会覆盖本机已提交的干净数据）。
on:
  push:
    branches: [main]
    paths:
      - "fund-tracker/**"
      - ".github/workflows/fund-tracker-daily.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fund-tracker/package-lock.json

      - name: Install deps
        working-directory: fund-tracker
        run: |
          npm ci
          npm ci --prefix web

      # vite build 时 copyDataPlugin 会把 fund-tracker/data/*.json 拷进 web/dist/data
      - name: Build web
        working-directory: fund-tracker
        run: npm run build --prefix web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fund-tracker/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
